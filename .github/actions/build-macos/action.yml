name: Build (macOS)
description: Packages the macOS app as keymapper-macos.zip and uploads it as the "macos" artifact.

# Composite action: the calling job runs on macos-latest and checks out the repo first. It runs the tests
# (.github/actions/test-macos) before packaging, so nothing untested is released, and packages the
# Release build the tests leave in build/. release.yml calls it.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/test-macos

    # The build leaves everything the app needs next to the program (web/, actions.macos.txt,
    # mappings.default.txt); pick just those, not the test binary or the static library.
    - name: Collect the app
      shell: bash
      run: |
        mkdir -p package
        cp build/keymapper package/
        cp -r build/web package/web
        cp build/actions.macos.txt build/mappings.default.txt package/
        cp INSTALL.md package/  # how to run the zip

    # python's zipfile module keeps the program's executable bit.
    - name: Zip the app
      shell: bash
      run: |
        cd package
        python3 -m zipfile -c ../keymapper-macos.zip *

    - name: Upload the zip
      uses: actions/upload-artifact@v4
      with:
        name: macos
        path: keymapper-macos.zip
        if-no-files-found: error
