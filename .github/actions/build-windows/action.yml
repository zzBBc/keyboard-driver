name: Build (Windows)
description: Packages the Windows app as keymapper-windows.zip and keymapper-windows-setup.exe and uploads them as the "windows" artifact.

# Composite action: the calling job runs on windows-latest and checks out the repo first. It builds the
# Release app and packages it, without running tests: release.yml runs them first in test_windows and
# only starts this after they pass.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/make-icons

    - name: Configure
      shell: bash
      run: cmake -S . -B build

    - name: Build (Release)
      shell: bash
      run: cmake --build build --config Release

    # The build leaves everything the app needs next to the exe (web/, actions.windows.txt,
    # mappings.default.txt); pick just those, not the test binary or the static library.
    - name: Collect the app
      shell: bash
      run: |
        mkdir -p package
        cp build/Release/keymapper.exe package/
        cp -r build/Release/web package/web
        cp build/Release/actions.windows.txt build/Release/mappings.default.txt package/
        cp INSTALL.md package/  # how to run the zip

    # python's zipfile module writes portable (forward-slash) entries.
    - name: Zip the app
      shell: bash
      run: |
        cd package
        python -m zipfile -c ../keymapper-windows.zip *

    # The installer keeps mappings.txt and devices\ across updates (installer/keymapper.iss never ships or
    # removes them). Inno Setup is preinstalled on windows-latest. A tag build (v1.2.3) stamps its version.
    - name: Build the installer
      shell: bash
      run: |
        version=dev
        [[ "$GITHUB_REF" == refs/tags/v* ]] && version="${GITHUB_REF#refs/tags/v}"
        export MSYS2_ARG_CONV_EXCL="*"  # Git Bash must not rewrite the /D options as paths
        "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DSourceDir=$(pwd -W)\package" "/DAppVersion=$version" installer/keymapper.iss

    - name: Upload the zip and the installer
      uses: actions/upload-artifact@v4
      with:
        name: windows
        path: |
          keymapper-windows.zip
          keymapper-windows-setup.exe
        if-no-files-found: error
