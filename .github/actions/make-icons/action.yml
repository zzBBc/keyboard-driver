name: Make icons
description: Builds the icons of the given OSes from the master image, assets/icon.png.

# Composite action: the calling job has checked out the repo first. The generated icons (assets/keymapper.ico,
# assets/keymapper.icns, the Android mipmaps and web/icon.png) are not committed, so a job that builds an
# app runs this first, for its own OS only. release.yml, which builds all three OSes, runs it once in its
# `icons` job instead and hands the result to the other jobs as an artifact. See assets/make_icons.py.
inputs:
  os:
    description: 'OSes to build icons for, separated by spaces (windows, macos, android). Leave empty for all'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Pillow
      shell: bash
      run: python -m pip install pillow

    - name: Generate the icons
      shell: bash
      env:
        OS: ${{ inputs.os }}
      run: python assets/make_icons.py $OS  # unquoted on purpose: one argument per OS
