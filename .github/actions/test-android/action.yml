name: Test (Android)
description: Runs both test suites on Linux, which covers the Android layer's decisions, and nothing else (no packaging).

# Composite action: the calling job runs on ubuntu-latest and checks out the repo first.
# pr.yml and release.yml call it (`uses: ./.github/actions/test-android`), so a pull request and a
# release are tested the same way. There is no platform layer for Linux, so CMake builds only
# keymapper_core and the tests here; tests/android/ needs no Android because android_input.cpp uses no
# Android API. The app itself is compiled by build-android.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Configure
      shell: bash
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build the tests
      shell: bash
      run: cmake --build build --target keymapper_tests

    # tests/common/ and tests/android/
    - name: C++ tests
      shell: bash
      run: ctest --test-dir build --output-on-failure

    - name: GUI tests
      shell: bash
      run: node --test "tests/web/*.test.js"
