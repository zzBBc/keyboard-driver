name: Build and test (Windows)
description: Builds the app on Windows and runs both test suites, and nothing else (no packaging).

# Composite action: the calling job runs on windows-latest and checks out the repo first.
# pr.yml and build-windows call it (`uses: ./.github/actions/test-windows`), so a pull
# request and a release are tested the same way.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Configure
      shell: bash
      run: cmake -S . -B build

    - name: Build (Release)
      shell: bash
      run: cmake --build build --config Release

    # tests/common/ and tests/windows/
    - name: C++ tests
      shell: bash
      run: ctest --test-dir build -C Release --output-on-failure

    - name: GUI tests
      shell: bash
      run: node --test "tests/web/*.test.js"
