name: PR

# Pull requests build and run both test suites on Windows, macOS and Linux (the Android layer), and check that the
# Android app still builds. Nothing is published.
on:
  pull_request:

jobs:
  test_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-windows

  test_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-macos

  test_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-android

  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-android

  # The one check the "master requires the PR check" ruleset waits for: passes when every job passes.
  pr:
    needs: [test_windows, test_macos, test_android, build_android]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Everything passed"
