name: PR

# Pull requests build and run both test suites, nothing is published.
on:
  pull_request:

jobs:
  test_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-windows

  test_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-macos

  # The one check the "master requires the PR check" ruleset waits for: passes when both OSes pass.
  pr:
    needs: [test_windows, test_macos]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Both OSes passed"
