name: Release

# Runs on a version tag (v1.2.3) or a manual run. A plain push to a branch (master included) does not
# start it, and pull requests have their own workflow (pr.yml).
# It tests Windows and macOS side by side, packages each OS once its tests pass (one failing stops the
# release), then publishes both zips in a single commit to release/<os>/<version>/ when there is a
# version, release/<os>/ when there is not.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version folder (for example v1.2.3). Leave empty to publish to release/<os>/'
        required: false
        default: ''

jobs:
  test_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-windows

  test_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-macos

  build_windows:
    needs: test_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows

  build_macos:
    needs: test_macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-macos

  # Commit both built zips into the repo with one push.
  publish:
    needs: [build_windows, build_macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read  # the push uses the deploy key, not this token
    concurrency:
      group: publish-release  # one push at a time
      cancel-in-progress: false
    steps:
      # The branch, not the tag: a tag checkout is detached and can't be pushed to.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}  # git pull and push go over SSH with this key
      - uses: ./.github/actions/publish
        with:
          deploy-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
