name: Release

# Runs on a version tag (v1.2.3) or a manual run. A plain push to a branch (master included) does not
# start it, and pull requests have their own workflow (pr.yml).
# It runs release_windows.yml and release_macos.yml side by side: each tests, packages and publishes its
# own OS, so one failing does not hold back the other. To release one OS only, run that workflow by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:  # the called workflows read it from this run's inputs
        description: 'Version folder (for example v1.2.3). Leave empty to publish to release/<os>/'
        required: false
        default: ''

jobs:
  windows:
    uses: ./.github/workflows/release_windows.yml
    secrets: inherit  # RELEASE_DEPLOY_KEY, for publish.yml

  macos:
    uses: ./.github/workflows/release_macos.yml
    secrets: inherit
