name: Release

# Runs on a version tag (v1.2.3), on a manual run, and on pull requests. A plain push to a branch
# (master included) does not start it.
# Always: build and run both test suites. A version tag or a manual run also publishes the app by
# committing it back to the default branch as a single zip: release/<os>/<version>/ when there is a
# version, release/<os>/ when there is not. Pull requests only build and test.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version folder (for example v1.2.3). Leave empty to publish to release/<os>/'
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          # Add macos / linux here once src/platform/<os>/ exists.
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure
        run: cmake -S . -B build

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: GUI tests
        shell: bash
        run: node --test "tests/web/*.test.js"

      # The build leaves everything the app needs next to the exe (web/, actions.txt,
      # mappings.default.txt); pick just those, not the test binary or the static library.
      - name: Collect the app
        shell: bash
        run: |
          mkdir -p package
          cp build/Release/keymapper.exe package/
          cp -r build/Release/web package/web
          cp build/Release/actions.txt build/Release/mappings.default.txt package/

      # One zip per OS. python's zipfile module is on every runner and writes the same portable
      # (forward-slash) entries everywhere.
      - name: Zip the app
        shell: bash
        run: |
          cd package
          python -m zipfile -c "../keymapper-${{ matrix.os }}.zip" *

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: keymapper-${{ matrix.os }}.zip
          if-no-files-found: error

  # Only for a version tag or a manual run: commit the builds into the repo.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release  # one push at a time
      cancel-in-progress: false

    steps:
      - name: Work out the version (may be empty)
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}  # via env, never pasted into the script
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          # a version becomes a folder name: keep it to a plain, safe string
          if [[ -n "$version" && ( ! "$version" =~ ^[A-Za-z0-9._-]+$ || "$version" == .* ) ]]; then
            echo "Invalid version '$version'" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # The branch, not the tag: a tag checkout is detached and can't be pushed to.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: staging  # one sub-folder per artifact, named after the os

      - name: Place the zips in release/<os>/[<version>/]
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for osdir in staging/*/; do
            os="$(basename "$osdir")"
            dest="release/$os"
            [[ -n "$VERSION" ]] && dest="$dest/$VERSION"
            mkdir -p "$dest"
            # keymapper-<os>.zip, or keymapper-<os>-<version>.zip. Only this file is replaced, so
            # publishing without a version leaves the version folders inside release/<os>/ alone.
            cp "${osdir}keymapper-$os.zip" "$dest/keymapper-$os${VERSION:+-$VERSION}.zip"
            echo "published $os to $dest/keymapper-$os${VERSION:+-$VERSION}.zip"
          done

      - name: Commit and push
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A release
          if git diff --cached --quiet; then
            echo "release/ is already up to date"
            exit 0
          fi
          if [[ -n "$VERSION" ]]; then message="chore: add release $VERSION builds"; else message="chore: update release builds"; fi
          git commit -m "$message"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
