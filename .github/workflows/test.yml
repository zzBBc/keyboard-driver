name: Build and test

# Reusable: the one place that builds the app and runs both test suites, and nothing else (no packaging).
# pr.yml and release.yml call it (`uses: ./.github/workflows/test.yml`), so a pull request and a release
# are tested the same way.
on:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          # Add macos / linux here once src/platform/<os>/ exists.
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure
        run: cmake -S . -B build

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: GUI tests
        shell: bash
        run: node --test "tests/web/*.test.js"
