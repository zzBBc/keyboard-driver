<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keymapper</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <h1>Keymapper</h1>
  <p class="sub">Changes apply immediately when you save. No restart needed.</p>
  <p class="sub">
    Keyboard:
    <select id="device"></select>
    <button id="detect" title="Select the keyboard you pressed a key on last">Detect</button>
    <button id="reset" hidden>Use default config</button>
  </p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="panel" id="panel"></div>
  <details>
    <summary>Config file preview</summary>
    <pre id="preview"></pre>
  </details>
</main>
<div class="bar"><div>
  <span id="status">Loading…</span>
  <button id="revert">Revert</button>
  <button id="save" class="primary">Save</button>
</div></div>
<datalist id="keys"></datalist>


<script src="/js/state.js"></script>
<script src="/js/config.js"></script>
<script src="/js/keyboard.js"></script>
<script src="/js/actions.js"></script>
<script src="/js/devices.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
