<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keymapper</title>
<style>
  :root {
    --bg: #fafafa; --panel: #fff; --line: #d8d8de; --text: #1c1c22; --muted: #6a6a76;
    --accent: #3b5bdb; --bad: #c92a2a; --ok: #2b8a3e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --panel: #1f1f25; --line: #34343d; --text: #e8e8ee; --muted: #9a9aa8; --accent: #7c93ff; --bad: #ff6b6b; --ok: #69db7c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 96px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  button, input, select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  select { max-width: 100%; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: -1px; }
  .tab { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .tab[aria-selected="true"] { background: var(--panel); border-bottom-color: var(--panel); font-weight: 600; }
  .tab.add { color: var(--muted); border-style: dashed; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 0 8px 8px 8px; padding: 14px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row input { flex: 1; min-width: 0; }
  .row .arrow { color: var(--muted); }
  .trigger { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  input.invalid { border-color: var(--bad); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); }
  .bar > div { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
  #status { flex: 1; color: var(--muted); white-space: pre-wrap; }
  #status.err { color: var(--bad); } #status.ok { color: var(--ok); }
  details { margin-top: 16px; color: var(--muted); }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; color: var(--text); }
  .kbd-scroll { overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
  .kbd { --u: 34px; display: inline-block; user-select: none; }
  .krow { display: flex; margin-bottom: 4px; white-space: nowrap; }
  .gap { flex: none; }
  .key { flex: none; height: var(--u); margin-right: 4px; padding: 2px 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; line-height: 1.1; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
  .key small { font-size: 10px; color: var(--accent); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .key:hover { border-color: var(--accent); }
  .key.mapped { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
  .key.trig { background: var(--accent); border-color: var(--accent); color: #fff; cursor: default; }
  .key.trig small { color: #fff; }
  .key.sel { outline: 2px solid var(--text); outline-offset: 1px; }
  .key.picking { cursor: crosshair; }
  .kedit { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; color: var(--muted); }
  .kedit input { width: 130px; }
  .kedit button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { color: var(--muted); padding: 8px 0 12px; }
</style>
</head>
<body>
<main>
  <h1>Keymapper</h1>
  <p class="sub">Changes apply immediately when you save. No restart needed.</p>
  <p class="sub">
    Keyboard:
    <select id="device"></select>
    <button id="detect" title="Select the keyboard you pressed a key on last">Detect</button>
    <button id="reset" hidden>Use default config</button>
  </p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="panel" id="panel"></div>
  <details>
    <summary>Config file preview</summary>
    <pre id="preview"></pre>
  </details>
</main>
<div class="bar"><div>
  <span id="status">Loading…</span>
  <button id="revert">Revert</button>
  <button id="save" class="primary">Save</button>
</div></div>
<datalist id="keys"></datalist>

<script>
// state: { base: [[from, to]], layers: [{ trigger, maps: [[from, to]] }] }
const $ = id => document.getElementById(id);
let state = { base: [], layers: [] }, saved = '', current = 'base', validKeys = new Set();
let device = '';   // '' = default config, else a hardware id
let devices = [];  // [{ id, own, name }]
let lastKb = '';

function parse(text) {
  const s = { base: [], layers: [] };
  let list = s.base;
  for (let line of text.split('\n')) {
    const hash = line.indexOf('#'); if (hash >= 0) line = line.slice(0, hash);
    line = line.trim(); if (!line) continue;
    if (line.startsWith('[') && line.endsWith(']')) {
      const inner = line.slice(1, -1).trim();
      if (inner.toLowerCase() === 'base') list = s.base;
      else if (/^layer\b/i.test(inner)) { const l = { trigger: inner.slice(5).trim(), maps: [] }; s.layers.push(l); list = l.maps; }
      continue;
    }
    const eq = line.indexOf('=', 1); if (eq < 0) continue;
    list.push([line.slice(0, eq).trim(), line.slice(eq + 1).trim()]);
  }
  return s;
}

function serialize(s) {
  const rows = m => m.filter(([a, b]) => a || b).map(([a, b]) => `${a} = ${b}`);
  let out = rows(s.base).join('\n');
  for (const l of s.layers) out += `${out ? '\n\n' : ''}[layer ${l.trigger}]\n${rows(l.maps).join('\n')}`;
  return out + '\n';
}

// Keyboard picture. Rows of [name, width in units] or a number (blank gap).
const KB_ROWS = [
  [['esc',1], 1, ['f1',1], ['f2',1], ['f3',1], ['f4',1], .5, ['f5',1], ['f6',1], ['f7',1], ['f8',1], .5, ['f9',1], ['f10',1], ['f11',1], ['f12',1], .5, ['printscreen',1], ['scrolllock',1], ['pause',1]],
  [..."`1234567890-=".split('').map(c => [c,1]), ['backspace',2], .5, ['insert',1], ['home',1], ['pageup',1]],
  [['tab',1.5], ..."qwertyuiop[]".split('').map(c => [c,1]), ['\\',1.5], .5, ['delete',1], ['end',1], ['pagedown',1]],
  [['capslock',1.75], ..."asdfghjkl;'".split('').map(c => [c,1]), ['enter',2.25]],
  [['lshift',2.25], ..."zxcvbnm,./".split('').map(c => [c,1]), ['rshift',2.75], 1.5, ['up',1]],
  [['lctrl',1.25], ['lwin',1.25], ['lalt',1.25], ['space',6.25], ['ralt',1.25], ['rwin',1.25], ['apps',1.25], ['rctrl',1.25], .5, ['left',1], ['down',1], ['right',1]],
];
const KB_LABELS = { esc: 'Esc', printscreen: 'PrtSc', scrolllock: 'ScrLk', pause: 'Pause', backspace: 'Bksp', insert: 'Ins', home: 'Home', pageup: 'PgUp', delete: 'Del', end: 'End', pagedown: 'PgDn', tab: 'Tab', capslock: 'Caps', enter: 'Enter', lshift: 'Shift', rshift: 'Shift', lctrl: 'Ctrl', rctrl: 'Ctrl', lwin: 'Win', rwin: 'Win', lalt: 'Alt', ralt: 'AltGr', apps: 'Menu', space: 'Space', up: '\u2191', down: '\u2193', left: '\u2190', right: '\u2192' };
const keyLabel = n => KB_LABELS[n] || (n.length === 1 || /^f\d+$/.test(n) ? n.toUpperCase() : n);
let selKey = '', picking = false;

function buildKeyboard(list, trigger) {
  const wrap = document.createElement('div');
  const find = name => list.findIndex(x => x[0].toLowerCase() === name);

  const scroll = document.createElement('div'); scroll.className = 'kbd-scroll';
  const kbd = document.createElement('div'); kbd.className = 'kbd';
  for (const row of KB_ROWS) {
    const r = document.createElement('div'); r.className = 'krow';
    for (const item of row) {
      if (typeof item === 'number') { const g = document.createElement('div'); g.className = 'gap'; g.style.width = `calc(var(--u) * ${item} + ${item * 4}px)`; r.appendChild(g); continue; }
      const [name, w] = item;
      const k = document.createElement('div'); k.className = 'key';
      k.style.width = `calc(var(--u) * ${w} + ${(w - 1) * 4}px)`;
      const main = document.createElement('span'); main.textContent = keyLabel(name); k.appendChild(main);
      const i = find(name);
      const isTrig = !!trigger && trigger.toLowerCase() === name;
      const isLayerKey = !trigger && state.layers.some(l => l.trigger.toLowerCase() === name);
      if (isTrig) { k.classList.add('trig'); k.title = 'Layer key'; const sm = document.createElement('small'); sm.textContent = 'layer'; k.appendChild(sm); }
      else if (i >= 0 && list[i][1]) { k.classList.add('mapped'); const sm = document.createElement('small'); sm.textContent = '\u2192 ' + keyLabel(list[i][1].toLowerCase()); k.appendChild(sm); k.title = `${name} \u2192 ${list[i][1]}`; }
      else if (isLayerKey) { const sm = document.createElement('small'); sm.textContent = 'layer'; k.appendChild(sm); }
      if (name === selKey) k.classList.add('sel');
      if (picking) k.classList.add('picking');
      k.onclick = () => {
        if (isTrig) return;
        if (picking && selKey) { setTarget(list, selKey, name); picking = false; return render(); }
        selKey = name === selKey ? '' : name; picking = false; render();
      };
      r.appendChild(k);
    }
    kbd.appendChild(r);
  }
  scroll.appendChild(kbd); wrap.appendChild(scroll);

  const ed = document.createElement('div'); ed.className = 'kedit';
  if (!selKey) ed.textContent = 'Click a key to choose what it should become.';
  else {
    const i = find(selKey);
    const input = keyInput(i >= 0 ? list[i][1] : '', () => {});
    input.onchange = () => { setTarget(list, selKey, input.value.trim()); render(); };
    const pick = document.createElement('button'); pick.textContent = picking ? 'Click a key\u2026' : 'Pick on keyboard'; pick.className = picking ? 'on' : '';
    pick.onclick = () => { picking = !picking; render(); };
    const clear = document.createElement('button'); clear.textContent = 'Clear'; clear.disabled = i < 0;
    clear.onclick = () => { setTarget(list, selKey, ''); render(); };
    const strong = document.createElement('b'); strong.textContent = keyLabel(selKey); strong.style.color = 'var(--text)';
    ed.append(strong, ' becomes ', input, pick, clear);
  }
  wrap.appendChild(ed);
  return wrap;
}

// Set (or with '' remove) the mapping for `from` in this list.
function setTarget(list, from, to) {
  const i = list.findIndex(x => x[0].toLowerCase() === from);
  if (!to) { if (i >= 0) list.splice(i, 1); }
  else if (i >= 0) list[i][1] = to;
  else list.push([from, to]);
}

function maps() { return current === 'base' ? state.base : state.layers[current].maps; }

function render() {
  const tabs = $('tabs'); tabs.innerHTML = '';
  const mk = (label, key, cls) => {
    const b = document.createElement('button');
    b.className = 'tab ' + (cls || ''); b.textContent = label; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(current === key));
    b.onclick = () => { if (key === 'add') addLayer(); else { current = key; selKey = ''; picking = false; render(); } };
    tabs.appendChild(b);
  };
  mk('Base', 'base');
  state.layers.forEach((l, i) => mk(`Layer: ${l.trigger || '?'}`, i));
  mk('+ Layer', 'add', 'add');

  const p = $('panel'); p.innerHTML = '';
  const isLayer = current !== 'base';
  const list = maps();

  if (isLayer) {
    const t = document.createElement('div'); t.className = 'trigger';
    t.append('While holding ', keyInput(state.layers[current].trigger, v => { state.layers[current].trigger = v; renderTabsOnly(); }), ' these apply:');
    p.appendChild(t);
  }
  p.appendChild(buildKeyboard(list, isLayer ? state.layers[current].trigger : ''));
  if (!list.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No mappings yet.'; p.appendChild(e); }

  list.forEach((pair, i) => {
    const r = document.createElement('div'); r.className = 'row';
    const arrow = document.createElement('span'); arrow.className = 'arrow'; arrow.textContent = '→';
    const d = document.createElement('button'); d.textContent = '×'; d.title = 'Remove';
    d.onclick = () => { list.splice(i, 1); render(); };
    r.append(keyInput(pair[0], v => pair[0] = v), arrow, keyInput(pair[1], v => pair[1] = v), d);
    p.appendChild(r);
  });

  const act = document.createElement('div'); act.className = 'actions';
  const add = document.createElement('button'); add.textContent = '+ Add mapping';
  add.onclick = () => { list.push(['', '']); render(); const ins = p.querySelectorAll('.row input'); ins[ins.length - 2].focus(); };
  act.appendChild(add);
  if (isLayer) {
    const vim = document.createElement('button'); vim.textContent = 'Add HJKL arrows';
    vim.onclick = () => { for (const [a, b] of [['h','left'],['j','down'],['k','up'],['l','right']]) if (!list.some(x => x[0].toLowerCase() === a)) list.push([a, b]); render(); };
    const del = document.createElement('button'); del.textContent = 'Delete layer';
    del.onclick = () => { state.layers.splice(current, 1); current = 'base'; render(); };
    act.append(vim, del);
  }
  p.appendChild(act);
  updateMeta();
}

function renderTabsOnly() { // keep input focus while typing a layer key
  const tabs = $('tabs').children;
  state.layers.forEach((l, i) => tabs[i + 1].textContent = `Layer: ${l.trigger || '?'}`);
  updateMeta();
}

function keyInput(value, onChange) {
  const i = document.createElement('input');
  i.value = value; i.setAttribute('list', 'keys'); i.autocomplete = 'off'; i.spellcheck = false;
  const check = () => i.classList.toggle('invalid', !!i.value && validKeys.size > 0 && !validKeys.has(i.value.toLowerCase()));
  i.oninput = () => { onChange(i.value.trim()); check(); updateMeta(); };
  check();
  return i;
}

function problems() {
  const out = [];
  const bad = k => !k || (validKeys.size && !validKeys.has(k.toLowerCase()));
  const scan = (label, list) => list.forEach(([a, b]) => { if (a || b) { if (bad(a)) out.push(`${label}: unknown key "${a}"`); if (bad(b)) out.push(`${label}: unknown key "${b}"`); } });
  scan('Base', state.base);
  state.layers.forEach(l => { if (bad(l.trigger)) out.push(`Layer: unknown key "${l.trigger}"`); scan(`Layer ${l.trigger}`, l.maps); });
  return out;
}

function updateMeta() {
  const text = serialize(state);
  $('preview').textContent = text;
  const dirty = text !== saved;
  $('save').disabled = !dirty; $('revert').disabled = !dirty;
  const probs = problems();
  if (probs.length) setStatus(probs[0] + (probs.length > 1 ? ` (+${probs.length - 1} more)` : ''), 'err');
  else setStatus(dirty ? 'Unsaved changes' : 'Saved and active', dirty ? '' : 'ok');
}

function setStatus(msg, cls) { const s = $('status'); s.textContent = msg; s.className = cls || ''; }

function addLayer() {
  state.layers.push({ trigger: '', maps: [] });
  current = state.layers.length - 1; render();
  document.querySelector('.trigger input').focus();
}

const cfgUrl = () => '/api/config' + (device ? '?device=' + encodeURIComponent(device) : '');
const HDR = { 'X-Requested-With': 'keymapper' };

async function save() {
  if (problems().length) return updateMeta();
  const text = serialize(state);
  const res = await fetch(cfgUrl(), { method: 'PUT', headers: { ...HDR, 'Content-Type': 'text/plain' }, body: text });
  if (res.ok) { saved = text; updateMeta(); refreshDevices(); }
  else setStatus('Server rejected the config:\n' + await res.text(), 'err');
}

async function loadConfig() {
  state = parse(await fetch(cfgUrl()).then(r => r.text())); saved = serialize(state); current = 'base'; render();
}

function renderDevices() {
  const sel = $('device');
  sel.innerHTML = '';
  const add = (id, label) => { const o = document.createElement('option'); o.value = id; o.textContent = label; sel.appendChild(o); };
  add('', 'Default (keyboards without their own config)');
  for (const d of devices) add(d.id, (d.name === d.id ? d.id : `${d.name} (${d.id})`) + (d.own ? ' ✓' : '') + (d.id === lastKb ? ' ← last used' : ''));
  if (device && !devices.some(d => d.id === device)) add(device, device + ' (not connected)');
  sel.value = device;
  const cur = devices.find(d => d.id === device);
  $('reset').hidden = !(device && (!cur || cur.own));
}

async function refreshDevices() {
  const lines = (await fetch('/api/devices').then(r => r.text())).split('\n').filter(Boolean);
  lastKb = '';
  devices = [];
  for (const l of lines) {
    const [id, own, ...name] = l.split('\t');
    if (id === 'last') lastKb = own || ''; else devices.push({ id, own: own === '1', name: name.join('\t') });
  }
  renderDevices();
}

async function switchDevice(id) {
  if (serialize(state) !== saved && !confirm('Discard unsaved changes?')) return renderDevices();
  device = id; renderDevices(); await loadConfig();
}

async function load() {
  const keys = await fetch('/api/keys').then(r => r.text());
  const names = keys.split('\n').filter(Boolean);
  validKeys = new Set(names.map(n => n.toLowerCase()));
  $('keys').innerHTML = names.map(n => `<option value="${n}">`).join('');
  await refreshDevices();
  await loadConfig();
}

$('device').onchange = e => switchDevice(e.target.value);
$('detect').onclick = async () => { await refreshDevices(); if (lastKb) switchDevice(lastKb); else setStatus('Press a key on the keyboard first', ''); };
$('reset').onclick = async () => {
  if (!confirm("Delete this keyboard's own config and use the default?")) return;
  await fetch(cfgUrl(), { method: 'DELETE', headers: HDR });
  await refreshDevices(); await loadConfig();
};
setInterval(() => { if (document.activeElement !== $('device')) refreshDevices().catch(() => {}); }, 3000);

$('save').onclick = () => save().catch(e => setStatus('Save failed: ' + e.message, 'err'));
$('revert').onclick = () => { state = parse(saved); current = 'base'; render(); };
window.addEventListener('beforeunload', e => { if (serialize(state) !== saved) e.preventDefault(); });
load().catch(e => setStatus('Cannot reach keymapper: ' + e.message, 'err'));
</script>
</body>
</html>
