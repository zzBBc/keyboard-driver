<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keymapper</title>
<style>
  :root {
    --bg: #fafafa; --panel: #fff; --line: #d8d8de; --text: #1c1c22; --muted: #6a6a76;
    --accent: #3b5bdb; --bad: #c92a2a; --ok: #2b8a3e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --panel: #1f1f25; --line: #34343d; --text: #e8e8ee; --muted: #9a9aa8; --accent: #7c93ff; --bad: #ff6b6b; --ok: #69db7c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 96px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  button, input, select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  select { max-width: 100%; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: -1px; }
  .tab { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .tab[aria-selected="true"] { background: var(--panel); border-bottom-color: var(--panel); font-weight: 600; }
  .tab.add { color: var(--muted); border-style: dashed; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 0 8px 8px 8px; padding: 14px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row input { flex: 1; min-width: 0; }
  .row .arrow { color: var(--muted); }
  .trigger { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  input.invalid { border-color: var(--bad); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); }
  .bar > div { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
  #status { flex: 1; color: var(--muted); white-space: pre-wrap; }
  #status.err { color: var(--bad); } #status.ok { color: var(--ok); }
  details { margin-top: 16px; color: var(--muted); }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; color: var(--text); }
  .kbd-scroll { overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
  .kbd { --u: 34px; display: inline-block; user-select: none; }
  .krow { display: flex; margin-bottom: 4px; white-space: nowrap; }
  .gap { flex: none; }
  .key { flex: none; height: var(--u); margin-right: 4px; padding: 2px 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; line-height: 1.1; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
  .key small { font-size: 10px; color: var(--accent); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .key:hover { border-color: var(--accent); }
  .key.mapped { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
  .key.trig { background: var(--accent); border-color: var(--accent); color: #fff; cursor: default; }
  .key.trig small { color: #fff; }
  .key.sel { outline: 2px solid var(--text); outline-offset: 1px; }
  .key.picking { cursor: crosshair; }
  .kedit { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; color: var(--muted); }
  .kedit input { width: 180px; }
  .kedit button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .kmods { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; color: var(--muted); }
  .kmods label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .action { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
  .action .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .action .head input { font-weight: 600; width: 220px; }
  .builtin { margin-top: 16px; }
  .builtin summary { cursor: pointer; color: var(--text); font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 8px; margin: 0 6px 4px 0; border: 1px solid var(--accent); border-radius: 12px; background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
  .chip button { border: 0; background: transparent; padding: 0 4px; line-height: 1; color: var(--muted); }
  .bbind { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding-bottom: 4px; }
  .bedit { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px; border: 1px dashed var(--line); border-radius: 8px; margin-bottom: 6px; }
  .bedit label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .bedit .on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bedit .note { flex-basis: 100%; color: var(--muted); }
  .brow { display: grid; grid-template-columns: 170px 1fr auto; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .brow .bname { font-weight: 600; }
  .brow .bdesc { color: var(--muted); }
  .brow code { color: var(--accent); white-space: nowrap; }
  .kinfo { flex-basis: 100%; color: var(--text); }
  .kedit select, .row select { max-width: 320px; text-overflow: ellipsis; }
  .row select { flex: 1; min-width: 0; }
  .hint { color: var(--muted); margin: 0 0 12px; }
  .empty { color: var(--muted); padding: 8px 0 12px; }
</style>
</head>
<body>
<main>
  <h1>Keymapper</h1>
  <p class="sub">Changes apply immediately when you save. No restart needed.</p>
  <p class="sub">
    Keyboard:
    <select id="device"></select>
    <button id="detect" title="Select the keyboard you pressed a key on last">Detect</button>
    <button id="reset" hidden>Use default config</button>
  </p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="panel" id="panel"></div>
  <details>
    <summary>Config file preview</summary>
    <pre id="preview"></pre>
  </details>
</main>
<div class="bar"><div>
  <span id="status">Loading…</span>
  <button id="revert">Revert</button>
  <button id="save" class="primary">Save</button>
</div></div>
<datalist id="keys"></datalist>


<script>
// state: { base: [[from, to]], layers: [{ trigger, maps: [[from, to]] }] }
const $ = id => document.getElementById(id);
let state = { base: [], layers: [], actions: [] }, saved = '', current = 'base', validKeys = new Set();
let allKeyNames = [];
let builtin = [];  // [{ name, desc, steps }] from config/actions.txt, read-only
let device = '';   // '' = default config, else a hardware id
let devices = [];  // [{ id, own, name }]
let lastKb = '';

const MODS = ['ctrl', 'alt', 'shift', 'win'];
const ACTION_NAME = /^[a-z0-9_-]+$/;

// Same rule as the server: the '=' of "from = to" is not the one in "alt+=".
function findEq(line) {
  let eq = line.indexOf('=', 1);
  while (eq > 0 && line[eq - 1] === '+') eq = line.indexOf('=', eq + 1);
  return eq;
}

function parse(text) {
  const s = { base: [], layers: [], actions: [] };
  let list = s.base, action = null;
  for (let line of text.split('\n')) {
    const hash = line.indexOf('#'); if (hash >= 0) line = line.slice(0, hash);
    line = line.trim(); if (!line) continue;
    if (line.startsWith('[') && line.endsWith(']')) {
      const inner = line.slice(1, -1).trim();
      action = null;
      if (inner.toLowerCase() === 'base') list = s.base;
      else if (/^layer\b/i.test(inner)) { const l = { trigger: inner.slice(5).trim(), maps: [] }; s.layers.push(l); list = l.maps; }
      else if (/^action\b/i.test(inner)) { action = { name: inner.slice(6).trim().toLowerCase(), desc: '', steps: [] }; s.actions.push(action); }
      continue;
    }
    const eq = findEq(line);
    if (action && /^description:/i.test(line)) { action.desc = line.slice(12).trim(); continue; }
    if (action && eq < 0) { action.steps.push(line); continue; }
    if (action) { action = null; list = s.base; }  // a "from = to" line ends the action
    if (eq < 0) continue;
    list.push([line.slice(0, eq).trim(), line.slice(eq + 1).trim()]);
  }
  return s;
}

// Base mappings first (they must precede any section header), then actions, then layers.
function serialize(s) {
  const rows = m => m.filter(([a, b]) => a || b).map(([a, b]) => `${a} = ${b}`);
  const blocks = [];
  if (rows(s.base).length) blocks.push(rows(s.base).join('\n'));
  for (const a of s.actions) blocks.push([`[action ${a.name}]`, ...(a.desc ? [`description: ${a.desc}`] : []), ...a.steps.filter(Boolean)].join('\n'));
  for (const l of s.layers) blocks.push(`[layer ${l.trigger}]\n${rows(l.maps).join('\n')}`);
  return blocks.join('\n\n') + '\n';
}

// "Alt + q" -> "alt+q"; modifiers in a fixed order so "shift+ctrl+a" equals "ctrl+shift+a".
function normChord(str) {
  const parts = str.split('+').map(x => x.trim().toLowerCase());
  const key = parts.pop();
  return [...MODS.filter(m => parts.includes(m)), key].join('+');
}
function validChord(str) {
  const parts = str.split('+').map(x => x.trim().toLowerCase());
  const key = parts.pop();
  return !!key && (validKeys.size === 0 || validKeys.has(key)) && parts.every(m => MODS.includes(m));
}
function validSteps(str) { return !!str && (validChord(str) || str.split(',').every(x => validChord(x))); }
function actionNames() { return [...new Set([...state.actions.map(a => a.name), ...builtin.map(b => b.name)])]; }
// Description and steps for an action name: your own definition wins over the built-in one.
function actionInfo(name) {
  name = name.toLowerCase();
  const mine = state.actions.find(a => a.name === name);
  if (mine) return { name, desc: mine.desc, steps: mine.steps.filter(Boolean).join(', '), builtin: false };
  const b = builtin.find(x => x.name === name);
  return b ? { ...b, builtin: true } : null;
}
function validTarget(str) {
  if (str.startsWith('@')) return actionNames().includes(str.slice(1).trim().toLowerCase());
  return validSteps(str);
}

// Keyboard picture. Rows of [name, width in units] or a number (blank gap).
const KB_ROWS = [
  [['esc',1], 1, ['f1',1], ['f2',1], ['f3',1], ['f4',1], .5, ['f5',1], ['f6',1], ['f7',1], ['f8',1], .5, ['f9',1], ['f10',1], ['f11',1], ['f12',1], .5, ['printscreen',1], ['scrolllock',1], ['pause',1]],
  [..."`1234567890-=".split('').map(c => [c,1]), ['backspace',2], .5, ['insert',1], ['home',1], ['pageup',1]],
  [['tab',1.5], ..."qwertyuiop[]".split('').map(c => [c,1]), ['\\',1.5], .5, ['delete',1], ['end',1], ['pagedown',1]],
  [['capslock',1.75], ..."asdfghjkl;'".split('').map(c => [c,1]), ['enter',2.25]],
  [['lshift',2.25], ..."zxcvbnm,./".split('').map(c => [c,1]), ['rshift',2.75], 1.5, ['up',1]],
  [['lctrl',1.25], ['lwin',1.25], ['lalt',1.25], ['space',6.25], ['ralt',1.25], ['rwin',1.25], ['apps',1.25], ['rctrl',1.25], .5, ['left',1], ['down',1], ['right',1]],
];
const KB_LABELS = { esc: 'Esc', printscreen: 'PrtSc', scrolllock: 'ScrLk', pause: 'Pause', backspace: 'Bksp', insert: 'Ins', home: 'Home', pageup: 'PgUp', delete: 'Del', end: 'End', pagedown: 'PgDn', tab: 'Tab', capslock: 'Caps', enter: 'Enter', lshift: 'Shift', rshift: 'Shift', lctrl: 'Ctrl', rctrl: 'Ctrl', lwin: 'Win', rwin: 'Win', lalt: 'Alt', ralt: 'AltGr', apps: 'Menu', space: 'Space', up: '\u2191', down: '\u2193', left: '\u2190', right: '\u2192' };
const keyLabel = n => KB_LABELS[n] || (n.length === 1 || /^f\d+$/.test(n) ? n.toUpperCase() : n);
const chordLabel = c => c.split('+').map(x => MODS.includes(x) ? x[0].toUpperCase() + x.slice(1) : keyLabel(x)).join('+');
// Short text for what a key becomes: a key name, a chord, or "@action".
const targetLabel = t => t.startsWith('@') ? t : (t.includes(',') ? t : chordLabel(normChord(t)));
let selKey = '', picking = false, selMods = [];

const fromStr = name => [...MODS.filter(m => selMods.includes(m)), name].join('+');

function buildKeyboard(list, trigger) {
  const wrap = document.createElement('div');
  const find = name => list.findIndex(x => normChord(x[0]) === fromStr(name));

  // Modifier checkboxes: pick Alt, then click Q to edit "alt+q".
  const mods = document.createElement('div'); mods.className = 'kmods';
  mods.append('With:');
  for (const m of MODS) {
    const l = document.createElement('label'), c = document.createElement('input');
    c.type = 'checkbox'; c.checked = selMods.includes(m);
    c.onchange = () => { selMods = c.checked ? [...selMods, m] : selMods.filter(x => x !== m); picking = false; render(); };
    l.append(c, m[0].toUpperCase() + m.slice(1)); mods.appendChild(l);
  }
  wrap.appendChild(mods);

  const scroll = document.createElement('div'); scroll.className = 'kbd-scroll';
  const kbd = document.createElement('div'); kbd.className = 'kbd';
  for (const row of KB_ROWS) {
    const r = document.createElement('div'); r.className = 'krow';
    for (const item of row) {
      if (typeof item === 'number') { const g = document.createElement('div'); g.className = 'gap'; g.style.width = `calc(var(--u) * ${item} + ${item * 4}px)`; r.appendChild(g); continue; }
      const [name, w] = item;
      const k = document.createElement('div'); k.className = 'key';
      k.style.width = `calc(var(--u) * ${w} + ${(w - 1) * 4}px)`;
      const main = document.createElement('span'); main.textContent = keyLabel(name); k.appendChild(main);
      const i = find(name);
      const isTrig = !selMods.length && !!trigger && trigger.toLowerCase() === name;
      const isLayerKey = !selMods.length && !trigger && state.layers.some(l => l.trigger.toLowerCase() === name);
      if (isTrig) { k.classList.add('trig'); k.title = 'Layer key'; const sm = document.createElement('small'); sm.textContent = 'layer'; k.appendChild(sm); }
      else if (i >= 0 && list[i][1]) { k.classList.add('mapped'); const sm = document.createElement('small'); sm.textContent = '\u2192 ' + targetLabel(list[i][1]); k.appendChild(sm); k.title = `${list[i][0]} \u2192 ${list[i][1]}`; }
      else if (isLayerKey) { const sm = document.createElement('small'); sm.textContent = 'layer'; k.appendChild(sm); }
      if (name === selKey) k.classList.add('sel');
      if (picking) k.classList.add('picking');
      k.onclick = () => {
        if (isTrig) return;
        if (picking && selKey) { setTarget(list, fromStr(selKey), name); picking = false; return render(); }
        selKey = name === selKey ? '' : name; picking = false; render();
      };
      r.appendChild(k);
    }
    kbd.appendChild(r);
  }
  scroll.appendChild(kbd); wrap.appendChild(scroll);

  const ed = document.createElement('div'); ed.className = 'kedit';
  if (!selKey) ed.textContent = 'Click a key to choose what it should become. Tick modifiers first to bind a combo like Alt+Q.';
  else {
    const i = find(selKey);
    const input = targetSelect(i >= 0 ? list[i][1] : '', v => { setTarget(list, fromStr(selKey), v); render(); });
    const pick = document.createElement('button'); pick.textContent = picking ? 'Click a key\u2026' : 'Pick on keyboard'; pick.className = picking ? 'on' : '';
    pick.onclick = () => { picking = !picking; render(); };
    const clear = document.createElement('button'); clear.textContent = 'Clear'; clear.disabled = i < 0;
    clear.onclick = () => { setTarget(list, fromStr(selKey), ''); render(); };
    const strong = document.createElement('b'); strong.textContent = chordLabel(fromStr(selKey)); strong.style.color = 'var(--text)';
    ed.append(strong, ' becomes ', input, pick, clear);
    const target = (i >= 0 ? list[i][1] : '').trim();
    const info = target.startsWith('@') ? actionInfo(target.slice(1)) : null;
    if (info) {
      const d = document.createElement('div'); d.className = 'kinfo';
      d.textContent = `@${info.name}: ${info.desc || 'no description'} (${info.steps})`;
      ed.appendChild(d);
    }
    const hint = document.createElement('div'); hint.style.flexBasis = '100%';
    hint.textContent = 'Pick a key or an action from the list, or use "Pick on keyboard" and then click the key it should become.';
    ed.appendChild(hint);
  }
  wrap.appendChild(ed);
  return wrap;
}

// What a key becomes, picked from a list: actions (yours, then built-in) and keys.
// A value that isn't in the list (a combo or steps written by hand in the config) stays selectable
// as "Custom" so it isn't lost. Picking calls onPick(value) with "@name" or a key name.
function targetSelect(value, onPick) {
  const sel = document.createElement('select');
  const cur = value.trim();
  const mine = state.actions.map(x => x.name).filter(n => ACTION_NAME.test(n));
  const lib = builtin.map(x => x.name).filter(n => !mine.includes(n));
  const keyNames = allKeyNames;
  const known = new Set([...mine.map(n => '@' + n), ...lib.map(n => '@' + n), ...keyNames]);
  const isKnown = known.has(cur.toLowerCase());

  const add = (parent, v, label) => { const o = document.createElement('option'); o.value = v; o.textContent = label; parent.appendChild(o); };
  add(sel, '', 'Choose\u2026');
  if (cur && !isKnown) add(sel, cur, 'Custom: ' + cur);
  const group = (label, items) => {
    if (!items.length) return;
    const g = document.createElement('optgroup'); g.label = label;
    for (const [v, text] of items) add(g, v, text);
    sel.appendChild(g);
  };
  const actionItem = n => { const info = actionInfo(n); return ['@' + n, info && info.desc ? `${n} \u2014 ${info.desc}` : n]; };
  group('Your actions', mine.map(actionItem));
  group('Built-in actions', lib.map(actionItem));
  group('Keys', keyNames.map(k => [k, keyLabel(k) === k ? k : `${k} (${keyLabel(k)})`]));
  sel.value = !cur ? '' : isKnown ? cur.toLowerCase() : cur;
  sel.onchange = () => { if (sel.value) onPick(sel.value); };
  return sel;
}

// Set (or with '' remove) the mapping for `from` (a canonical chord string) in this list.
function setTarget(list, from, to) {
  const i = list.findIndex(x => normChord(x[0]) === from);
  if (!to) { if (i >= 0) list.splice(i, 1); }
  else if (i >= 0) list[i][1] = to;
  else list.push([from, to]);
}

// ---- Actions tab: give an action a shortcut. Actions come from the lists; only the combo is new. ----
let bind = null;  // { action, mods: [], key: '', scope: 'base' | layer index, recording: bool }

const CODE_KEYS = { Space: 'space', Tab: 'tab', Enter: 'enter', Escape: 'esc', Backspace: 'backspace', ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
  Home: 'home', End: 'end', PageUp: 'pageup', PageDown: 'pagedown', Insert: 'insert', Delete: 'delete', CapsLock: 'capslock', Minus: '-', Equal: '=',
  BracketLeft: '[', BracketRight: ']', Backslash: '\\', Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', Backquote: '`',
  PrintScreen: 'printscreen', ScrollLock: 'scrolllock', Pause: 'pause', ContextMenu: 'apps' };
function keyFromEvent(e) {
  if (/^Key[A-Z]$/.test(e.code)) return e.code.slice(3).toLowerCase();
  if (/^Digit\d$/.test(e.code)) return e.code.slice(5);
  if (/^F\d{1,2}$/.test(e.code)) return e.code.toLowerCase();
  return CODE_KEYS[e.code] || '';  // modifier keys and anything unknown: not a key for a shortcut
}
// Record the next shortcut pressed in the browser. (Windows keeps some, like Alt+Tab, for itself:
// use the checkboxes and key list for those.)
document.addEventListener('keydown', e => {
  if (!bind || !bind.recording) return;
  e.preventDefault();
  const noMods = !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey;
  if (e.key === 'Escape' && noMods) { bind.recording = false; return render(); }
  const key = keyFromEvent(e);
  if (!key) return;  // only a modifier so far: keep waiting
  bind.mods = MODS.filter(m => ({ ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey, win: e.metaKey })[m]);
  bind.key = key; bind.recording = false;
  render();
}, true);

function scopeList(scope) { return scope === 'base' ? state.base : state.layers[scope].maps; }
function scopeLabel(scope) { return scope === 'base' ? 'Base' : `Layer: ${state.layers[scope].trigger || '?'}`; }

// Shortcuts currently bound to an action, across the base and all layers.
function bindingsFor(name) {
  const out = [];
  const scan = (scope, list) => list.forEach(([from, to]) => { if (to.trim().toLowerCase() === '@' + name) out.push({ scope, list, from }); });
  scan('base', state.base);
  state.layers.forEach((l, i) => scan(i, l.maps));
  return out;
}

function bindEditor(name) {
  const ed = document.createElement('div'); ed.className = 'bedit';
  const rec = document.createElement('button'); rec.className = bind.recording ? 'on' : '';
  rec.textContent = bind.recording ? 'Press the shortcut\u2026 (Esc cancels)' : 'Record shortcut';
  rec.onclick = () => { bind.recording = !bind.recording; render(); };
  ed.appendChild(rec);

  ed.append('or');
  for (const m of MODS) {
    const l = document.createElement('label'), c = document.createElement('input');
    c.type = 'checkbox'; c.checked = bind.mods.includes(m);
    c.onchange = () => { bind.mods = c.checked ? [...bind.mods, m] : bind.mods.filter(x => x !== m); render(); };
    l.append(c, m[0].toUpperCase() + m.slice(1)); ed.appendChild(l);
  }
  const key = document.createElement('select');
  const none = document.createElement('option'); none.value = ''; none.textContent = 'Key\u2026'; key.appendChild(none);
  for (const k of allKeyNames) { const o = document.createElement('option'); o.value = k; o.textContent = keyLabel(k) === k ? k : `${k} (${keyLabel(k)})`; key.appendChild(o); }
  key.value = bind.key; key.onchange = () => { bind.key = key.value; render(); };
  ed.appendChild(key);

  if (state.layers.length) {
    const sc = document.createElement('select');
    const add = (v, t) => { const o = document.createElement('option'); o.value = String(v); o.textContent = t; sc.appendChild(o); };
    add('base', 'in Base');
    state.layers.forEach((l, i) => add(i, `in ${scopeLabel(i)}`));
    sc.value = String(bind.scope);
    sc.onchange = () => { bind.scope = sc.value === 'base' ? 'base' : Number(sc.value); render(); };
    ed.appendChild(sc);
  }

  const combo = bind.key ? [...MODS.filter(m => bind.mods.includes(m)), bind.key].join('+') : '';
  const ok = document.createElement('button'); ok.className = 'primary'; ok.disabled = !combo;
  ok.textContent = combo ? `Bind ${chordLabel(combo)}` : 'Bind';
  ok.onclick = () => { setTarget(scopeList(bind.scope), combo, '@' + name); bind = null; render(); };
  const cancel = document.createElement('button'); cancel.textContent = 'Cancel';
  cancel.onclick = () => { bind = null; render(); };
  ed.append(ok, cancel);

  if (combo) {
    const hit = scopeList(bind.scope).find(([a]) => normChord(a) === combo);
    const note = document.createElement('div'); note.className = 'note';
    if (hit && hit[1].trim().toLowerCase() !== '@' + name) note.textContent = `${chordLabel(combo)} is currently \u2192 ${hit[1]}; binding will replace that.`;
    else if (hit) note.textContent = `${chordLabel(combo)} already runs this action.`;
    if (note.textContent) ed.appendChild(note);
  }
  return ed;
}

function renderActions(p) {
  const hint = document.createElement('p'); hint.className = 'hint';
  hint.textContent = 'Pick an action and give it a shortcut. Press Save to apply. (Windows keeps some shortcuts, like Alt+Tab, for itself; enter those with the boxes instead of recording.)';
  p.appendChild(hint);

  const section = (title, rows) => {
    if (!rows.length) return;
    const det = document.createElement('details'); det.className = 'builtin'; det.open = true;
    const sum = document.createElement('summary'); sum.textContent = `${title} (${rows.length})`;
    det.appendChild(sum);
    for (const b of rows) {
      const r = document.createElement('div'); r.className = 'brow';
      const nm = document.createElement('span'); nm.className = 'bname'; nm.textContent = b.name;
      const ds = document.createElement('span'); ds.className = 'bdesc'; ds.textContent = b.desc;
      const st = document.createElement('code'); st.textContent = b.steps;
      r.append(nm, ds, st);

      const bd = document.createElement('div'); bd.className = 'bbind';
      for (const x of bindingsFor(b.name)) {
        const chip = document.createElement('span'); chip.className = 'chip';
        chip.append((x.scope === 'base' ? '' : scopeLabel(x.scope) + ': ') + chordLabel(normChord(x.from)));
        const rm = document.createElement('button'); rm.textContent = '\u00d7'; rm.title = 'Remove this shortcut';
        rm.onclick = () => { setTarget(x.list, normChord(x.from), ''); render(); };
        chip.appendChild(rm); bd.appendChild(chip);
      }
      const open = bind && bind.action === b.name;
      if (!open) {
        const add = document.createElement('button'); add.textContent = '+ Shortcut';
        add.onclick = () => { bind = { action: b.name, mods: [], key: '', scope: 'base', recording: false }; render(); };
        bd.appendChild(add);
      }
      r.appendChild(bd);
      if (open) r.appendChild(bindEditor(b.name));
      det.appendChild(r);
    }
    p.appendChild(det);
  };

  // Actions written by hand in the config file are listed too; their steps can only be changed in the file.
  section('In your config file', state.actions.map(a => ({ name: a.name, desc: a.desc || '', steps: a.steps.filter(Boolean).join(', ') })));
  section('Built-in actions', builtin.filter(b => !state.actions.some(a => a.name === b.name)));
  if (!builtin.length && !state.actions.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = 'No actions found (actions.txt next to the exe).';
    p.appendChild(e);
  }
}

function maps() { return current === 'base' ? state.base : state.layers[current].maps; }

function render() {
  const tabs = $('tabs'); tabs.innerHTML = '';
  const mk = (label, key, cls) => {
    const b = document.createElement('button');
    b.className = 'tab ' + (cls || ''); b.textContent = label; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(current === key));
    b.onclick = () => { if (key === 'add') addLayer(); else { current = key; selKey = ''; picking = false; selMods = []; bind = null; render(); } };
    tabs.appendChild(b);
  };
  mk('Base', 'base');
  state.layers.forEach((l, i) => mk(`Layer: ${l.trigger || '?'}`, i));
  mk('Actions', 'actions');
  mk('+ Layer', 'add', 'add');

  const p = $('panel'); p.innerHTML = '';
  if (current === 'actions') { renderActions(p); updateMeta(); return; }
  const isLayer = current !== 'base';
  const list = maps();

  if (isLayer) {
    const t = document.createElement('div'); t.className = 'trigger';
    t.append('While holding ', keyInput(state.layers[current].trigger, v => { state.layers[current].trigger = v; renderTabsOnly(); }), ' these apply:');
    p.appendChild(t);
  }
  p.appendChild(buildKeyboard(list, isLayer ? state.layers[current].trigger : ''));
  if (!list.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No mappings yet.'; p.appendChild(e); }

  list.forEach((pair, i) => {
    const r = document.createElement('div'); r.className = 'row';
    const arrow = document.createElement('span'); arrow.className = 'arrow'; arrow.textContent = '→';
    const d = document.createElement('button'); d.textContent = '×'; d.title = 'Remove';
    d.onclick = () => { list.splice(i, 1); render(); };
    r.append(keyInput(pair[0], v => pair[0] = v, 'from'), arrow, targetSelect(pair[1], v => { pair[1] = v; render(); }), d);
    p.appendChild(r);
  });

  const act = document.createElement('div'); act.className = 'actions';
  const add = document.createElement('button'); add.textContent = '+ Add mapping';
  add.onclick = () => { list.push(['', '']); render(); const ins = p.querySelectorAll('.row input'); ins[ins.length - 2].focus(); };
  act.appendChild(add);
  if (isLayer) {
    const vim = document.createElement('button'); vim.textContent = 'Add HJKL arrows';
    vim.onclick = () => { for (const [a, b] of [['h','left'],['j','down'],['k','up'],['l','right']]) if (!list.some(x => x[0].toLowerCase() === a)) list.push([a, b]); render(); };
    const del = document.createElement('button'); del.textContent = 'Delete layer';
    del.onclick = () => { state.layers.splice(current, 1); current = 'base'; render(); };
    act.append(vim, del);
  }
  p.appendChild(act);
  updateMeta();
}

function renderTabsOnly() { // keep input focus while typing a layer key
  const tabs = $('tabs').children;
  state.layers.forEach((l, i) => tabs[i + 1].textContent = `Layer: ${l.trigger || '?'}`);
  updateMeta();
}

// kind: 'key' = one key, 'from' = key or combo, 'to' = key, combo, steps or @action, 'step' = combo or steps.
function keyInput(value, onChange, kind = 'key') {
  const i = document.createElement('input');
  const ok = { key: v => validKeys.has(v.toLowerCase()), from: validChord, to: validTarget, step: validSteps }[kind];
  i.value = value; i.setAttribute('list', 'keys'); i.autocomplete = 'off'; i.spellcheck = false;
  const check = () => i.classList.toggle('invalid', !!i.value.trim() && validKeys.size > 0 && !ok(i.value.trim()));
  i.oninput = () => { onChange(i.value.trim()); check(); updateMeta(); };
  check();
  return i;
}

function problems() {
  const out = [];
  const known = validKeys.size > 0;
  const scan = (label, list) => list.forEach(([a, b]) => {
    if (!a && !b) return;
    if (known && !validChord(a)) out.push(`${label}: unknown key "${a}"`);
    if (known && !validTarget(b)) out.push(`${label}: unknown key or action "${b}"`);
  });
  scan('Base', state.base);
  state.layers.forEach(l => { if (known && !validKeys.has(l.trigger.toLowerCase())) out.push(`Layer: unknown key "${l.trigger}"`); scan(`Layer ${l.trigger}`, l.maps); });
  const seen = new Set();
  state.actions.forEach(a => {
    if (!ACTION_NAME.test(a.name)) out.push(`Action "${a.name}": use letters, digits, - and _`);
    else if (seen.has(a.name)) out.push(`Action "${a.name}" is defined twice`);
    seen.add(a.name);
    if (!a.steps.some(Boolean)) out.push(`Action "${a.name}" has no steps`);
    a.steps.forEach(st => { if (st && known && !validSteps(st)) out.push(`Action "${a.name}": bad step "${st}"`); });
  });
  return out;
}

function updateMeta() {
  const text = serialize(state);
  $('preview').textContent = text;
  const dirty = text !== saved;
  $('save').disabled = !dirty; $('revert').disabled = !dirty;
  const probs = problems();
  if (probs.length) setStatus(probs[0] + (probs.length > 1 ? ` (+${probs.length - 1} more)` : ''), 'err');
  else setStatus(dirty ? 'Unsaved changes' : 'Saved and active', dirty ? '' : 'ok');
}

function setStatus(msg, cls) { const s = $('status'); s.textContent = msg; s.className = cls || ''; }

function addLayer() {
  state.layers.push({ trigger: '', maps: [] });
  current = state.layers.length - 1; render();
  document.querySelector('.trigger input').focus();
}

const cfgUrl = () => '/api/config' + (device ? '?device=' + encodeURIComponent(device) : '');
const HDR = { 'X-Requested-With': 'keymapper' };

async function save() {
  if (problems().length) return updateMeta();
  const text = serialize(state);
  const res = await fetch(cfgUrl(), { method: 'PUT', headers: { ...HDR, 'Content-Type': 'text/plain' }, body: text });
  if (res.ok) { saved = text; updateMeta(); refreshDevices(); }
  else setStatus('Server rejected the config:\n' + await res.text(), 'err');
}

async function loadConfig() {
  state = parse(await fetch(cfgUrl()).then(r => r.text())); saved = serialize(state); current = 'base'; render();
}

function renderDevices() {
  const sel = $('device');
  sel.innerHTML = '';
  const add = (id, label) => { const o = document.createElement('option'); o.value = id; o.textContent = label; sel.appendChild(o); };
  add('', 'Default (keyboards without their own config)');
  for (const d of devices) add(d.id, (d.name === d.id ? d.id : `${d.name} (${d.id})`) + (d.own ? ' ✓' : '') + (d.id === lastKb ? ' ← last used' : ''));
  if (device && !devices.some(d => d.id === device)) add(device, device + ' (not connected)');
  sel.value = device;
  const cur = devices.find(d => d.id === device);
  $('reset').hidden = !(device && (!cur || cur.own));
}

async function refreshDevices() {
  const lines = (await fetch('/api/devices').then(r => r.text())).split('\n').filter(Boolean);
  lastKb = '';
  devices = [];
  for (const l of lines) {
    const [id, own, ...name] = l.split('\t');
    if (id === 'last') lastKb = own || ''; else devices.push({ id, own: own === '1', name: name.join('\t') });
  }
  renderDevices();
}

async function switchDevice(id) {
  if (serialize(state) !== saved && !confirm('Discard unsaved changes?')) return renderDevices();
  device = id; renderDevices(); await loadConfig();
}

async function load() {
  const keys = await fetch('/api/keys').then(r => r.text());
  const names = keys.split('\n').filter(Boolean);
  validKeys = new Set(names.map(n => n.toLowerCase()));
  allKeyNames = names;
  $('keys').innerHTML = names.map(n => `<option value="${n}">`).join('');
  builtin = (await fetch('/api/actions').then(r => r.text())).split('\n').filter(Boolean).map(l => {
    const [name, desc, steps] = l.split('\t');
    return { name, desc: desc || '', steps: steps || '' };
  });
  await refreshDevices();
  await loadConfig();
}

$('device').onchange = e => switchDevice(e.target.value);
$('detect').onclick = async () => { await refreshDevices(); if (lastKb) switchDevice(lastKb); else setStatus('Press a key on the keyboard first', ''); };
$('reset').onclick = async () => {
  if (!confirm("Delete this keyboard's own config and use the default?")) return;
  await fetch(cfgUrl(), { method: 'DELETE', headers: HDR });
  await refreshDevices(); await loadConfig();
};
setInterval(() => { if (document.activeElement !== $('device')) refreshDevices().catch(() => {}); }, 3000);

$('save').onclick = () => save().catch(e => setStatus('Save failed: ' + e.message, 'err'));
$('revert').onclick = () => { state = parse(saved); current = 'base'; render(); };
window.addEventListener('beforeunload', e => { if (serialize(state) !== saved) e.preventDefault(); });
load().catch(e => setStatus('Cannot reach keymapper: ' + e.message, 'err'));
</script>
</body>
</html>
